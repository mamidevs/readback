<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="The repository installs rules into your CLI. The CLI writes records to a local logbook folder. The lead and the outside judge use their model providers."><defs><marker id="a-fg" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#1F2328"/></marker><marker id="a-accent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#C4320A"/></marker><marker id="a-muted" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#59636E"/></marker></defs><rect x="340" y="112" width="590" height="198" fill="none" stroke="#C8D1DA" stroke-width="1.2" stroke-dasharray="6 6"/><text x="356" y="104" fill="#59636E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.5">YOUR MACHINE</text><rect x="30" y="150" width="200" height="100" fill="none" stroke="#1F2328" stroke-width="1.2"/><text x="130.0" y="178" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.5">REPOSITORY</text><text x="130.0" y="202" fill="#59636E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle">the protocol</text><text x="130.0" y="220" fill="#59636E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle">1 output style, 3 agents</text><rect x="370" y="150" width="220" height="100" fill="none" stroke="#1F2328" stroke-width="1.2"/><text x="480.0" y="178" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.5">YOUR CLI</text><text x="480.0" y="202" fill="#59636E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle">Claude Code or Codex</text><rect x="680" y="150" width="220" height="100" fill="none" stroke="#1F2328" stroke-width="1.2"/><text x="790.0" y="178" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.5">~/logbook</text><text x="790.0" y="202" fill="#59636E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle">one folder for each project</text><text x="790.0" y="220" fill="#59636E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle">a log and the stored records</text><rect x="370" y="12" width="220" height="62" fill="none" stroke="#59636E" stroke-width="1.2" stroke-dasharray="4 4"/><text x="480.0" y="37" fill="#59636E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.5">MODEL PROVIDERS</text><text x="480.0" y="57" fill="#59636E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle">lead and outside judge</text><line x1="230" y1="200" x2="367" y2="200" stroke="#1F2328" stroke-width="1.6" marker-end="url(#a-fg)"/><text x="282" y="190" fill="#1F2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle">install, update</text><line x1="590" y1="200" x2="677" y2="200" stroke="#1F2328" stroke-width="1.6" marker-end="url(#a-fg)"/><text x="635" y="190" fill="#1F2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle">writes</text><line x1="480" y1="77" x2="480" y2="147" stroke="#59636E" stroke-width="1.2" stroke-dasharray="4 4" marker-start="url(#a-muted)" marker-end="url(#a-muted)"/><text x="490" y="100" fill="#59636E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start">model calls</text><text x="790" y="286" fill="#C4320A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">records stay local</text></svg>
