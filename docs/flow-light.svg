<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="One task as messages between the owner, the lead, a worker, a judge and the logbook. Three messages are addressed to the owner."><defs><marker id="a-fg" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#1F2328"/></marker><marker id="a-accent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#C4320A"/></marker><marker id="a-muted" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#59636E"/></marker></defs><rect x="22" y="86" width="268" height="446" fill="#C4320A" opacity="0.07"/><rect x="28" y="20" width="144" height="48" fill="none" stroke="#1F2328" stroke-width="1.2"/><text x="100" y="41" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.5">OWNER</text><text x="100" y="58" fill="#59636E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle">you</text><line x1="100" y1="68" x2="100" y2="532" stroke="#C8D1DA" stroke-width="1.2" stroke-dasharray="3 5"/><rect x="218" y="20" width="144" height="48" fill="none" stroke="#1F2328" stroke-width="1.2"/><text x="290" y="41" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.5">LEAD</text><text x="290" y="58" fill="#59636E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle">the main session</text><line x1="290" y1="68" x2="290" y2="532" stroke="#C8D1DA" stroke-width="1.2" stroke-dasharray="3 5"/><rect x="408" y="20" width="144" height="48" fill="none" stroke="#1F2328" stroke-width="1.2"/><text x="480" y="41" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.5">WORKER</text><text x="480" y="58" fill="#59636E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle">another agent</text><line x1="480" y1="68" x2="480" y2="532" stroke="#C8D1DA" stroke-width="1.2" stroke-dasharray="3 5"/><rect x="598" y="20" width="144" height="48" fill="none" stroke="#1F2328" stroke-width="1.2"/><text x="670" y="41" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.5">JUDGE</text><text x="670" y="58" fill="#59636E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle">a different agent</text><line x1="670" y1="68" x2="670" y2="532" stroke="#C8D1DA" stroke-width="1.2" stroke-dasharray="3 5"/><rect x="788" y="20" width="144" height="48" fill="none" stroke="#1F2328" stroke-width="1.2"/><text x="860" y="41" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.5">LOGBOOK</text><text x="860" y="58" fill="#59636E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle">~/logbook</text><line x1="860" y1="68" x2="860" y2="532" stroke="#C8D1DA" stroke-width="1.2" stroke-dasharray="3 5"/><line x1="290" y1="112" x2="103" y2="112" stroke="#C4320A" stroke-width="1.6" marker-end="url(#a-accent)"/><text x="195.0" y="104" fill="#C4320A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-siz