onospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="0.5">HANDOFF</text><text x="385.0" y="311" fill="#59636E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle">state, changes, checks</text><line x1="290" y1="342" x2="667" y2="342" stroke="#1F2328" stroke-width="1.6" marker-end="url(#a-fg)"/><text x="385" y="334" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="0.5">handoff + contract</text><text x="385" y="357" fill="#59636E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle">sent for judgment</text><line x1="670" y1="388" x2="293" y2="388" stroke="#1F2328" stroke-width="1.6" marker-end="url(#a-fg)"/><text x="575" y="380" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="0.5">PASS / FAIL</text><text x="575" y="403" fill="#59636E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle">the first word</text><line x1="290" y1="434" x2="857" y2="434" stroke="#1F2328" stroke-width="1.6" marker-end="url(#a-fg)"/><text x="385" y="426" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="0.5">LOG</text><text x="385" y="449" fill="#59636E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle">one line for each change</text><line x1="290" y1="480" x2="103" y2="480" stroke="#C4320A" stroke-width="1.6" marker-end="url(#a-accent)"/><text x="195.0" y="472" fill="#C4320A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="0.5">BRIEF</text><text x="195.0" y="495" fill="#59636E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle">four fields, one next step</text><text x="156" y="548" fill="#C4320A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle">3 messages are for the owner</text></svg>
